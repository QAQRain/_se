<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資源點座標點選工具</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
         background: #1e2229; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 14px; background: #272c35; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           border-bottom: 1px solid #3a4250; }
  header h1 { font-size: 15px; margin: 0; margin-right: 6px; }
  button { background: #3a4250; color: #fff; border: 1px solid #4c5668; border-radius: 6px;
           padding: 5px 10px; font-size: 13px; cursor: pointer; }
  button:hover { background: #465063; }
  button.primary { background: #2e7d32; border-color: #388e3c; }
  button.danger { background: #b71c1c; border-color: #d32f2f; }
  .spacer { flex: 1; }
  .zoomlabel { font-size: 12px; color: #9aa4b2; }
  main { flex: 1; display: flex; min-height: 0; }
  #viewport { flex: 1; overflow: auto; position: relative; background: #14161a; }
  #stage { position: relative; transform-origin: 0 0; }
  #stage img { display: block; pointer-events: none; user-select: none; width: 100%; height: 100%; }
  #overlay { position: absolute; top: 0; left: 0; }
  .marker { position: absolute; width: 0; height: 0; }
  .marker .dot { position: absolute; width: 25px; height: 25px; border-radius: 50%;
                 border: 2px solid #fff; transform: translate(-50%, -50%);
                 cursor: grab; box-shadow: 0 0 4px rgba(0,0,0,.8); overflow: hidden; }
  .marker .dot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; pointer-events: none; }
  .marker .dot:hover { filter: brightness(1.3); }
  .marker.drag .dot { cursor: grabbing; outline: 2px solid #ffeb3b; }
  .marker .label { position: absolute; left: 9px; top: -15px; white-space: nowrap; font-size: 12px;
                   color: #fff; background: rgba(0,0,0,.65); padding: 1px 5px; border-radius: 3px;
                   text-shadow: 0 1px 2px #000; }
  .marker .label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                           margin-right: 4px; vertical-align: 0; }
  .marker.unnamed .label { color: #ffd54f; }
  .marker.sel .dot { outline: 2px solid #40c4ff; }
  .hint { position: absolute; top: 8px; left: 12px; z-index: 5; font-size: 12px; color: #bbb; background: rgba(0,0,0,.5);
          padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  aside { width: 300px; border-left: 1px solid #3a4250; background: #22262e; display: flex; flex-direction: column;
          overflow-y: auto; }
  aside section { padding: 10px 12px; border-bottom: 1px solid #333a44; }
  aside h2 { font-size: 13px; margin: 0 0 6px; color: #9aa4b2; }
  aside label { font-size: 12px; display: block; margin-bottom: 4px; color: #c3c9d2; }
  aside input[type=text] { width: 100%; background: #191d23; color: #fff; border: 1px solid #3a4250;
                           border-radius: 5px; padding: 5px 8px; font-size: 13px; }
  aside .field { margin-bottom: 8px; }
  .coord-row { font-size: 12px; color: #9aa4b2; margin-bottom: 6px; }
  textarea { width: 100%; height: 160px; background: #191d23; color: #7fd97f; border: 1px solid #3a4250;
             border-radius: 5px; font-family: monospace; font-size: 11px; padding: 6px; resize: vertical; }
  .btn-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .count { font-size: 12px; color: #9aa4b2; margin-left: 6px; }
  .type-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .type-btns button { text-align: left; display: flex; align-items: center; gap: 6px; }
  .type-btns button.active { outline: 2px solid #40c4ff; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6); }
  .show-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c3c9d2; margin-bottom: 3px; cursor: pointer; }
  .show-row .swatch { border: 1px solid #555; }
</style>
</head>
<body>

<header>
  <h1>資源點座標點選工具</h1>
  <button id="exportBtn" class="primary">匯出 JSON</button>
  <button id="downloadBtn">下載 .json</button>
  <button id="clearBtn" class="danger">清除全部</button>
  <span class="count" id="count">0 個標點</span>
  <span class="spacer"></span>
  <button id="editModeBtn" class="primary">編輯：開</button>
  <button id="resetViewBtn">重設視圖</button>
  <button id="one2oneBtn">1:1</button>
  <button id="zinBtn">＋</button>
  <button id="zoutBtn">－</button>
  <span class="zoomlabel" id="zoomLabel">100%</span>
</header>

<main>
  <div id="viewport">
    <div class="hint">拖曳地圖空白處＝移動地圖｜點擊空白＝新增所選類型｜拖曳圓點＝微調位置</div>
    <div id="stage">
      <img id="mapImg" src="../assets/resource-map.png" alt="地圖">
      <div id="overlay"></div>
    </div>
  </div>

  <aside>
    <section id="editSection">
      <h2>編輯標點</h2>
      <div class="coord-row" id="editCoord">未選取標點</div>
      <div class="field">
        <label>類型</label>
        <select id="typeSelect" style="width:100%;background:#191d23;color:#fff;border:1px solid #3a4250;border-radius:5px;padding:5px 8px;font-size:13px;" disabled></select>
      </div>
      <div class="field">
        <label>等級（白/綠/藍/紫＝Lv.1–4）</label>
        <select id="levelSelect" style="width:100%;background:#191d23;color:#fff;border:1px solid #3a4250;border-radius:5px;padding:5px 8px;font-size:13px;" disabled></select>
      </div>
      <div class="field">
        <label>名稱（可留空）</label>
        <input type="text" id="nameInput" placeholder="例如：礦山" disabled>
      </div>
      <div class="btn-row">
        <button id="delBtn" class="danger" disabled>刪除此標點</button>
        <button id="centerBtn" disabled>地圖跳到這點</button>
      </div>
    </section>

    <section>
      <h2>放置類型（點地圖前先選）</h2>
      <div class="type-btns" id="typeBtns"></div>
      <h2 style="margin-top:8px">放置等級</h2>
      <div class="type-btns" id="levelBtns"></div>
    </section>

    <section>
      <h2>顯示切換</h2>
      <div id="showToggles"></div>
      <p class="coord-row" style="margin-top:4px">勾選的類型才顯示（僅影響本工具的顯示）。</p>
    </section>

    <section>
      <h2>匯入 JSON</h2>
      <textarea id="jsonIn" placeholder='貼上 {"resources": [...]} 後按「匯入並替換」'></textarea>
      <div class="btn-row">
        <button id="importBtn" class="primary">匯入並替換標點</button>
      </div>
      <p class="coord-row" style="margin-top:6px">建議先按「重設視圖」用 100% 檢視再微調。</p>
    </section>

    <section>
      <h2>匯出 JSON</h2>
      <textarea id="jsonOut" readonly placeholder="點「匯出 JSON」產生內容"></textarea>
      <div class="btn-row">
        <button id="copyBtn">複製內容</button>
        <button id="exportBtn2" class="primary">匯出 JSON</button>
      </div>
    </section>
  </aside>
</main>

<script>
const TYPES = [
  { id: 'pi',       name: '皮',   color: '#a1887f', image: '../assets/res-points/pi.png' },
  { id: 'tie',      name: '鐵',   color: '#90a4ae', image: '../assets/res-points/tie.png' },
  { id: 'shi',      name: '石',   color: '#9e9e9e', image: '../assets/res-points/shi.png' },
  { id: 'mu',       name: '木',   color: '#5d4037', image: '../assets/res-points/mu.png' },
  { id: 'liang',    name: '糧',   color: '#ffb74d', image: '../assets/res-points/liang.png' },
  { id: 'ma',       name: '馬',   color: '#b39ddb', image: '../assets/res-points/ma.png' },
  { id: 'yizhan',   name: '驛站', color: '#ffffff' },
  { id: 'guankou',  name: '關口', color: '#ef5350' }
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));
const LEVELS = [
  { v: 1, name: 'Lv.1', colorName: '白', color: '#ffffff' },
  { v: 2, name: 'Lv.2', colorName: '綠', color: '#4caf72' },
  { v: 3, name: 'Lv.3', colorName: '藍', color: '#4a90d9' },
  { v: 4, name: 'Lv.4', colorName: '紫', color: '#9a6bd1' }
];
const LEVEL_BY_V = Object.fromEntries(LEVELS.map(l => [l.v, l]));

const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const img = document.getElementById('mapImg');
const overlay = document.getElementById('overlay');
const countEl = document.getElementById('count');

let NAT_W = 1122, NAT_H = 771;
let scale = 1;
let markers = []; // {id, type, level, name, x, y, el}
let selected = null;
let nextId = 1;
let drag = null;
let pan = null;
let placeType = 'pi';
let placeLevel = 1;
let placeMode = true;

function clientToPct(cx, cy) {
  const rect = viewport.getBoundingClientRect();
  const vx = cx - rect.left + viewport.scrollLeft;
  const vy = cy - rect.top + viewport.scrollTop;
  const x = Math.round(vx / scale / NAT_W * 10000) / 100;
  const y = Math.round(vy / scale / NAT_H * 10000) / 100;
  return { x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)) };
}

function loadState() {
  try {
    const raw = localStorage.getItem('resource_picker_points');
    if (raw) {
      markers = JSON.parse(raw).map(m => ({ id: m.id, type: m.type || 'pi', level: m.level || 1, name: m.name || '', x: Number(m.x), y: Number(m.y), el: null }));
      nextId = markers.reduce((a, m) => Math.max(a, parseInt(m.id.replace(/[^0-9]/g, '')) + 1), 1);
      for (const t of TYPES) setShow(t.id, true);
    }
  } catch (e) {}
}

function saveState() {
  const data = markers.map(m => ({ id: m.id, type: m.type, level: m.level, name: m.name, x: m.x, y: m.y }));
  localStorage.setItem('resource_picker_points', JSON.stringify(data));
}

function fitScale() {
  const pad = 20;
  return Math.min((viewport.clientWidth - pad) / NAT_W, (viewport.clientHeight - pad) / NAT_H);
}

function applyScale() {
  stage.style.width = (NAT_W * scale) + 'px';
  stage.style.height = (NAT_H * scale) + 'px';
  overlay.style.width = stage.style.width;
  overlay.style.height = stage.style.height;
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
}

function centerMap() {
  const s = fitScale();
  scale = s;
  applyScale();
  viewport.scrollLeft = (stage.clientWidth - viewport.clientWidth) / 2;
  viewport.scrollTop = (stage.clientHeight - viewport.clientHeight) / 2;
}

function zoomAt(cx, cy, factor) {
  const wx = cx + viewport.scrollLeft;
  const wy = cy + viewport.scrollTop;
  const oldScale = scale;
  scale = Math.max(fitScale(), Math.min(8, scale * factor));
  viewport.scrollLeft = (wx / oldScale) * scale - cx;
  viewport.scrollTop = (wy / oldScale) * scale - cy;
  applyScale();
}

function addMarker(xPct, yPct, type, level, name = '') {
  const m = { id: 'r' + (nextId++), type: type || placeType, level: level || placeLevel, name, x: xPct, y: yPct, el: null };
  m.el = renderMarker(m);
  markers.push(m);
  updateCount();
  saveState();
  return m;
}

function typeStyle(type) {
  const t = TYPE_BY_ID[type] || TYPES[0];
  return t.color;
}

function renderMarker(m) {
  const div = document.createElement('div');
  div.className = 'marker' + (m.name ? '' : ' unnamed');
  div.dataset.type = m.type;
  div.style.left = m.x + '%';
  div.style.top = m.y + '%';
  if (!isShow(m.type)) div.style.display = 'none';

  const t = TYPE_BY_ID[m.type] || TYPES[0];
  const lv = LEVEL_BY_V[m.level] || LEVELS[0];
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.background = t.color;
  dot.style.borderColor = lv.color;
  if (t.image) {
    const im = document.createElement('img');
    im.src = t.image;
    im.alt = t.name;
    im.draggable = false;
    im.addEventListener('error', () => im.remove());
    dot.appendChild(im);
  }
  const label = document.createElement('div');
  label.className = 'label';
  label.style.background = 'rgba(0,0,0,.65)';
  label.textContent = m.name || (t.name + ' · ' + lv.name);

  div.appendChild(dot);
  div.appendChild(label);

  dot.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if (e.button !== 0) return;
    select(m);
    startDrag(e, m);
  });

  overlay.appendChild(div);
  return div;
}

function startDrag(e, m) {
  drag = { m, startX: e.clientX, startY: e.clientY };
  m.el.classList.add('drag');
  overlay.setPointerCapture(e.pointerId);
}

function moveDrag(e) {
  if (!drag) return;
  const p = clientToPct(e.clientX, e.clientY);
  drag.m.x = p.x;
  drag.m.y = p.y;
  drag.m.el.style.left = p.x + '%';
  drag.m.el.style.top = p.y + '%';
}

function endDrag(e) {
  if (!drag) return;
  drag.m.el.classList.remove('drag');
  drag = null;
  saveState();
  updateEdit();
}

function select(m) {
  selected = m;
  for (const mm of markers) mm.el.classList.toggle('sel', mm === m);
  typeSelect.value = m.type;
  typeSelect.disabled = false;
  levelSelect.value = m.level;
  levelSelect.disabled = false;
  nameInput.value = m.name;
  nameInput.disabled = false;
  delBtn.disabled = false;
  centerBtn.disabled = false;
  updateEdit();
}

function updateEdit() {
  editCoord.textContent = selected ? `x: ${selected.x}%　y: ${selected.y}%` : '未選取標點';
}

function updateCount() {
  const named = markers.filter(m => m.name).length;
  countEl.textContent = `${markers.length} 個標點（已命名 ${named}）`;
}

function buildJSON() {
  return JSON.stringify({
    resources: markers.map(m => ({ id: m.id, type: m.type, level: m.level, name: m.name, x: m.x, y: m.y }))
  }, null, 2);
}

function refreshAll() {
  overlay.innerHTML = '';
  for (const m of markers) m.el = renderMarker(m);
  updateCount();
}

function isShow(type) {
  const el = document.getElementById('show_' + type);
  return el ? el.checked : true;
}

function setShow(type, on) {
  const el = document.getElementById('show_' + type);
  if (el) el.checked = on;
}

function applyShowFilters() {
  for (const m of markers) {
    if (!m.el) continue;
    m.el.style.display = isShow(m.type) ? '' : 'none';
  }
}

function buildTypeUI() {
  const btns = document.getElementById('typeBtns');
  btns.innerHTML = '';
  for (const t of TYPES) {
    const b = document.createElement('button');
    b.dataset.type = t.id;
    b.innerHTML = `<span class="swatch" style="background:${t.color}"></span>${t.name}`;
    b.addEventListener('click', () => {
      placeType = t.id;
      for (const x of btns.children) x.classList.toggle('active', x.dataset.type === t.id);
    });
    btns.appendChild(b);
  }
  btns.firstChild.classList.add('active');

  const lvBtns = document.getElementById('levelBtns');
  lvBtns.innerHTML = '';
  for (const lv of LEVELS) {
    const b = document.createElement('button');
    b.dataset.level = lv.v;
    b.innerHTML = `<span class="swatch" style="background:${lv.color}"></span>${lv.name}`;
    b.addEventListener('click', () => {
      placeLevel = lv.v;
      for (const x of lvBtns.children) x.classList.toggle('active', x.dataset.level == lv.v);
    });
    lvBtns.appendChild(b);
  }
  lvBtns.firstChild.classList.add('active');

  const sel = document.getElementById('typeSelect');
  sel.innerHTML = '';
  for (const t of TYPES) {
    const o = document.createElement('option');
    o.value = t.id;
    o.textContent = t.name;
    sel.appendChild(o);
  }

  const lvSel = document.getElementById('levelSelect');
  lvSel.innerHTML = '';
  for (const lv of LEVELS) {
    const o = document.createElement('option');
    o.value = lv.v;
    o.textContent = lv.name + '（' + lv.colorName + '）';
    lvSel.appendChild(o);
  }

  const showBox = document.getElementById('showToggles');
  showBox.innerHTML = '';
  for (const t of TYPES) {
    const lab = document.createElement('label');
    lab.className = 'show-row';
    lab.innerHTML = `<span class="swatch" style="background:${t.color}"></span>${t.name}`;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'show_' + t.id;
    cb.checked = true;
    cb.addEventListener('change', applyShowFilters);
    lab.prepend(cb);
    showBox.appendChild(lab);
  }
}

overlay.addEventListener('pointerdown', (e) => {
  if (e.target !== overlay || e.button !== 0) return;
  pan = { startX: e.clientX, startY: e.clientY, sl: viewport.scrollLeft, st: viewport.scrollTop, moved: false };
  overlay.setPointerCapture(e.pointerId);
});

overlay.addEventListener('pointermove', (e) => {
  if (drag) { moveDrag(e); return; }
  if (!pan) return;
  const dx = e.clientX - pan.startX;
  const dy = e.clientY - pan.startY;
  if (!pan.moved && Math.abs(dx) + Math.abs(dy) > 5) pan.moved = true;
  if (pan.moved) {
    viewport.scrollLeft = pan.sl - dx;
    viewport.scrollTop = pan.st - dy;
  }
});

overlay.addEventListener('pointerup', (e) => {
  if (drag) { endDrag(e); return; }
  if (!pan) return;
  const isClick = !pan.moved;
  pan = null;
  if (isClick && placeMode) {
    const p = clientToPct(e.clientX, e.clientY);
    addMarker(p.x, p.y, placeType);
  }
});

overlay.addEventListener('pointercancel', () => {
  if (drag) endDrag(null);
  pan = null;
});

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// --- UI controls ---
const nameInput = document.getElementById('nameInput');
const typeSelect = document.getElementById('typeSelect');
const levelSelect = document.getElementById('levelSelect');
const delBtn = document.getElementById('delBtn');
const centerBtn = document.getElementById('centerBtn');
const editCoord = document.getElementById('editCoord');

nameInput.addEventListener('input', () => {
  if (!selected) return;
  selected.name = nameInput.value.trim();
  selected.el.classList.toggle('unnamed', !selected.name);
  const t = TYPE_BY_ID[selected.type] || TYPES[0];
  const lv = LEVEL_BY_V[selected.level] || LEVELS[0];
  selected.el.querySelector('.label').textContent = selected.name || (t.name + ' · ' + lv.name);
  updateCount();
  saveState();
});

nameInput.addEventListener('change', () => {
  if (selected) select(selected);
});

typeSelect.addEventListener('change', () => {
  if (!selected) return;
  selected.type = typeSelect.value;
  const t = TYPE_BY_ID[selected.type] || TYPES[0];
  selected.el.querySelector('.dot').style.background = t.color;
  selected.el.dataset.type = selected.type;
  if (!selected.name) {
    const lv = LEVEL_BY_V[selected.level] || LEVELS[0];
    selected.el.querySelector('.label').textContent = t.name + ' · ' + lv.name;
  }
  applyShowFilters();
  saveState();
});

levelSelect.addEventListener('change', () => {
  if (!selected) return;
  selected.level = Number(levelSelect.value);
  const lv = LEVEL_BY_V[selected.level] || LEVELS[0];
  selected.el.querySelector('.dot').style.borderColor = lv.color;
  if (!selected.name) {
    const t = TYPE_BY_ID[selected.type] || TYPES[0];
    selected.el.querySelector('.label').textContent = t.name + ' · ' + lv.name;
  }
  saveState();
});

delBtn.addEventListener('click', () => {
  if (!selected) return;
  selected.el.remove();
  markers = markers.filter(m => m !== selected);
  selected = null;
  nameInput.value = '';
  nameInput.disabled = true;
  typeSelect.disabled = true;
  levelSelect.disabled = true;
  delBtn.disabled = true;
  centerBtn.disabled = true;
  editCoord.textContent = '未選取標點';
  updateCount();
  saveState();
});

centerBtn.addEventListener('click', () => {
  if (!selected) return;
  const sx = selected.x / 100 * NAT_W * scale - viewport.clientWidth / 2;
  const sy = selected.y / 100 * NAT_H * scale - viewport.clientHeight / 2;
  viewport.scrollLeft = sx;
  viewport.scrollTop = sy;
});

document.getElementById('resetViewBtn').addEventListener('click', () => centerMap());

const editModeBtn = document.getElementById('editModeBtn');
editModeBtn.addEventListener('click', () => {
  placeMode = !placeMode;
  editModeBtn.textContent = '編輯：' + (placeMode ? '開' : '關');
  editModeBtn.classList.toggle('primary', placeMode);
});

document.getElementById('one2oneBtn').addEventListener('click', () => {
  scale = 1;
  applyScale();
  viewport.scrollLeft = Math.max(0, (stage.clientWidth - viewport.clientWidth) / 2);
  viewport.scrollTop = Math.max(0, (stage.clientHeight - viewport.clientHeight) / 2);
});

const jsonIn = document.getElementById('jsonIn');
document.getElementById('importBtn').addEventListener('click', () => {
  try {
    const d = JSON.parse(jsonIn.value);
    if (!Array.isArray(d.resources)) throw new Error('缺少 resources 陣列');
    if (markers.length && !confirm('匯入會取代目前的標點，確定？')) return;
    overlay.innerHTML = '';
    markers = d.resources.map(m => ({ id: m.id || ('r' + nextId++), type: m.type || 'pi', level: m.level || 1, name: m.name || '', x: Number(m.x), y: Number(m.y), el: null }));
    nextId = markers.reduce((a, m) => Math.max(a, parseInt(m.id.replace(/[^0-9]/g, '')) + 1), 1);
    refreshAll();
    saveState();
    centerMap();
    selected = null;
    nameInput.value = '';
    nameInput.disabled = true;
    typeSelect.disabled = true;
    levelSelect.disabled = true;
    delBtn.disabled = true;
    centerBtn.disabled = true;
    editCoord.textContent = '未選取標點';
    updateCount();
  } catch (e) {
    alert('JSON 格式錯誤：' + e.message);
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('清除全部標點？此動作無法復原。')) return;
  overlay.innerHTML = '';
  markers = [];
  selected = null;
  nameInput.value = '';
  nameInput.disabled = true;
  typeSelect.disabled = true;
  levelSelect.disabled = true;
  delBtn.disabled = true;
  centerBtn.disabled = true;
  editCoord.textContent = '未選取標點';
  nextId = 1;
  updateCount();
  saveState();
});

function doExport() {
  jsonOut.value = buildJSON();
}

document.getElementById('exportBtn').addEventListener('click', doExport);
document.getElementById('exportBtn2').addEventListener('click', doExport);

document.getElementById('copyBtn').addEventListener('click', async () => {
  const copyBtn = document.getElementById('copyBtn');
  if (!jsonOut.value) doExport();
  try {
    await navigator.clipboard.writeText(jsonOut.value);
    copyBtn.textContent = '已複製！';
    setTimeout(() => copyBtn.textContent = '複製內容', 1200);
  } catch (e) {
    jsonOut.select();
    document.execCommand('copy');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildJSON();
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'resource-points.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('zinBtn').addEventListener('click', () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.3));
document.getElementById('zoutBtn').addEventListener('click', () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.3));

// --- init ---
const jsonOut = document.getElementById('jsonOut');

function init() {
  NAT_W = img.naturalWidth;
  NAT_H = img.naturalHeight;
  buildTypeUI();
  loadState();
  refreshAll();
  centerMap();
}

img.addEventListener('load', init);
if (img.complete && img.naturalWidth > 0) init();
</script>
</body>
</html>
